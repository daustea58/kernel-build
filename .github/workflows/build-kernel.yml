name: Build Kernel (surya - perf)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repo (script & config)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libelf-dev python3 python3-pip

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-surya-${{ github.sha }}
          restore-keys: |
            ccache-surya-

      - name: Cache toolchain & kernel source
        uses: actions/cache@v4
        with:
          path: |
            kernel
            clang
            gcc64
            gcc32
            susfs4ksu
          key: kernel-src-surya-${{ hashFiles('build.sh') }}
          restore-keys: |
            kernel-src-surya-

      - name: Enable ccache
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache -M 5G || true

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Run build
        run: ./build.sh

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-surya-perf-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          
